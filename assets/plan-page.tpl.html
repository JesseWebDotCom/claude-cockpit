:root[data-theme="dark"] .k-codex{--kbg:#272047;--kfg:#b3a4f5}:root[data-theme="dark"] .k-local{--kbg:#33363c;--kfg:#e6e6ea;box-shadow:inset 0 0 0 1px #4a4d54}:root[data-theme="dark"] .k-engine{--kbg:#3a2a10;--kfg:#f0b862}:root[data-theme="dark"] .k-opus{--kbg:#3b1a2d;--kfg:#f08cc0}
.run-list{display:flex;flex-direction:column;gap:8px}

.run-list{gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}

  const live=[...coR,...live0,...opRun.map(x=>({...x,ms:'off plan',off:true}))];
  const wk={};live.forEach(x=>{const[k,c,l0]=kind(x.owner);const l=c==='codex'?l0.replace(/ [A-Z]$/,''):l0;(wk[l]=wk[l]||{k,c,l,n:0}).n++});
  const isLoc=x=>kind(x.owner)[1]==='local',locL=live.filter(isLoc),cldL=live.filter(x=>!isLoc(x));
  const wstrip=Object.values(wk).map(w=>`<span class="wk"><span class="chip k-${w.c}">${ICON[w.k]}${esc(w.l)}</span><b>×${w.n}</b></span>`).join('');
  app.append(box('run-box','Running now',live.length,wstrip,'Nothing running.',`${(()=>{const R=s=>`<details class="run" style="display:block"><summary class="rs"><span class="t">${esc(s.title)}</span><span class="sl"><i class="dot"></i>${s.off?'<span class="offtag">off plan</span>':''}${chip(s)}${s.co?'':idc(s)}${s.co?(H.coordinator.lastActivityAt?`<i class="hd g"></i><span class="ha">${hAgo(Date.parse(H.coordinator.lastActivityAt))}</span>`:''):hDot(s.id)}<span class="time">${s.co?'':ago(s.startedAt)}</span></span></summary><div class="note rn">${s.note?esc(s.note)+'<br>':''}<span class="id">${esc(s.ms)}${s.startedAt?' · started '+esc(new Date(s.startedAt).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})):''}</span></div>${acts(s)}</details>`;const G=(t,a)=>`<div class="rg"><div class="rgh">${t} · ${a.length}</div>${a.length?`<div class="run-list">${a.map(R).join('')}</div>`:'<div class="rgn">None</div>'}</div>`;return G('Cloud',cldL)+G('Local',locL)})()}`));
  app.append($(`<section><div class="eyebrow" style="margin-bottom:6px">Milestones · active first, tap to drill in</div><div class="grid">${[...D.milestones].sort((x,y)=>{const r=m=>{const c=cnt(m.steps);return c.running?0:c.you?1:c.done===c.n?3:2};return r(x)-r(y)}).map(m=>{const c=cnt(m.steps);return `<button class="mcard" data-v="${esc(m.id)}"><div style="display:flex;justify-content:space-between;gap:8px"><h2>${esc(m.title)}</h2><span class="cnt">${c.done}/${c.n}</span></div>${bar(c)}<div class="tags">${c.running?`<span class="pill running">${c.running} running</span>`:''}${c.you?`<span class="pill you">${c.you} needs you</span>`:''}${c.todo?`<span class="pill todo">${c.todo} to do</span>`:''}${c.done===c.n?'<span class="pill done">complete</span>':''}</div></button>`}).join('')}</div></section>`));
  charsStart(app, danceOn(all));
  app.onclick=e=>{const x=e.target.closest('[data-dis],[data-undis]');if(x){e.preventDefault();e.stopPropagation();try{const k='cockpit-dismissed';let d=JSON.parse(localStorage.getItem(k)||'[]');if(x.dataset.undis)d=[];else d.push(x.dataset.dis);localStorage.setItem(k,JSON.stringify(d))}catch(_){}const o=document.querySelector('.sys');const was=o&&o.open;render();const n=document.querySelector('.sys');if(n&&was)n.open=true;return}const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)};
 }else{
  let title,list,c;
  if(view.startsWith('state:')){const k=view.slice(6);title=LBL[k][0].toUpperCase()+LBL[k].slice(1);list=steps.filter(s=>s.e===k);c=null}
  else{const m=D.milestones.find(m=>m.id===view);title=m.title;list=steps.filter(s=>s.ms===m.title);c=cnt(m.steps)}
  app.append($(`<button class="back" data-back>← All milestones</button>`));
  app.append($(`<div class="head"><div class="eyebrow">${c?'Milestone':'Across the whole plan'}</div><h1>${esc(title)}</h1>${c?bar(c)+`<div class="sub">${c.done} of ${c.n} done</div>`:`<div class="sub">${list.length} steps</div>`}</div>`));
  if(c){app.append($(`<div class="tabs">${[['open','Open'],['done','Done'],['all','All']].map(([k,l])=>`<button data-tab="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div>`));
   list=list.filter(s=>tab==='all'||(tab==='done'?s.e==='done':s.e!=='done'))}
  const o={running:0,you:1,todo:2,waiting:3,parked:4,done:5};list.sort((a,b)=>o[a.e]-o[b.e]);
  app.append($(`<div class="list">${list.map(drow).join('')||'<div class="note" style="padding:14px">Nothing here.</div>'}</div>`));
  app.onclick=e=>{if(e.target.closest('[data-back]'))go('home');const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render()}};
 }
}

let _aid=0;
const idc=s=>`<span class="id">${esc(s.id)}</span><button class="ib cp" data-copyid="${esc(s.id)}" data-tip="Copy ID" aria-label="Copy ${esc(s.id)}"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.500" y="5.500" width="8" height="8" rx="1.500"/><path d="M10.500 3.500v-.5A1.500 1.500 0 0 0 9 1.500H4A1.500 1.500 0 0 0 2.500 3v5A1.500 1.500 0 0 0 4 9.500h1.500"/></svg></button><button class="ib cp ask" data-ask data-tip="Ask a question" aria-label="Ask about ${esc(s.id)}"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M6.200 6.300a1.800 1.800 0 1 1 2.600 1.600c-.5.300-.8.700-.8 1.300"/><path d="M8 11.500v.01"/></svg></button>`;
const acts=s=>`<div class="act" data-sid="${esc(s.id)}"><input type="text" placeholder="Type a question or instruction (optional)" aria-label="Question about ${esc(s.id)}"><button class="ib go" data-copy="tell" data-tip="Send: posts ID: your text to the session as a message." aria-label="Send"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2L7 9M14 2l-4.500 12-2.500-5-5-2.500z"/></svg></button><div class="ans"></div></div>`;
const ctxFor=(id)=>{const s=steps.find(x=>x.id===id);const sib=steps.filter(x=>x.ms===s.ms&&x.id!==id).map(x=>`${x.id} [${x.e}] ${x.title}`).join('\n');return{s,text:`Plan goal: ${D.plan}\nMilestone: ${s.ms}\nStep: ${s.id} - ${s.title}\nState: ${s.e}${s.owner?'\nOwner: '+s.owner:''}${s.startedAt?'\nStarted: '+s.startedAt:''}${s.note?'\nNote: '+s.note:''}\n\nOther steps in this milestone:\n${sib}`}};
let CM=null;try{claude.use('comments').then(c=>{CM=c}).catch(()=>{})}catch(_){}
document.addEventListener('click',async e=>{
 document.querySelectorAll('.act.show').forEach(x=>{if(x.contains(e.target))return;const k=e.target.closest('[data-ask]');if(k&&k.closest('details')===x.closest('details'))return;x.classList.remove('show')});
 const ak=e.target.closest('[data-ask]');if(ak){e.preventDefault();const d=ak.closest('details'),ac=d&&d.querySelector('.act');if(ac){d.open=true;const on=ac.classList.toggle('show');if(on)ac.querySelector('input').focus()}return}
 const b=e.target.closest('[data-copy],[data-copyid]');if(!b)return;
 if(b.closest('summary'))e.preventDefault();
 if(b.dataset.copy==='tell'&&CM){
  const act=b.closest('.act'),inp=act.querySelector('input'),ans=act.querySelector('.ans'),q=inp.value.trim(),id=act.dataset.sid;
  if(!q){ans.textContent='Type your question first.';setTimeout(()=>{ans.textContent=''},2400);return}
  try{
   if(await CM.canSendToClaude()==='available'){
    const st=steps.find(x=>x.id===id);
    const anchor=await CM.anchorFor(act);
    await CM.sendToClaude({anchor,text:id+': '+q});
    inp.value='';act.classList.remove('show');const ak2=act.closest('details').querySelector('[data-ask]');if(ak2){ak2.classList.add('sent');ak2.dataset.tip='Sent. The reply will appear in the comment thread.';setTimeout(()=>{ak2.classList.remove('sent');ak2.dataset.tip='Ask a question'},3000)}return;
   }
  }catch(err){ans.textContent='Could not send ('+(err&&err.code||'error')+'). Copying instead.'}
 }
 const id=b.dataset.copyid||b.closest('.act').dataset.sid;
 const q=(b.closest('.act')?.querySelector('input')?.value||'').trim();
 const msg=id+(q?': '+q:'');
 const tip=b.dataset.tip;
 let ok=true;try{await navigator.clipboard.writeText(msg)}catch(_){ok=false}
 b.dataset.tip=ok?'Copied':'Copy blocked here: '+id;
 const ans=b.closest('.act')?.querySelector('.ans');if(ans)ans.textContent=(ok?'Copied. Paste into the prompt box and press Enter: ':'')+msg.trim();
 setTimeout(()=>{b.dataset.tip=tip;if(ans)ans.textContent=''},2400);
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-away]');if(!b)return;
 const want=AW?'off':'on',old=b.innerHTML;
 try{
  if(CM&&await CM.canSendToClaude()==='available'){
   const anchor=await CM.anchorFor(b);
   await CM.sendToClaude({anchor,text:'AWAY '+want});
   AW=!AW;b.classList.toggle('on',AW);b.setAttribute('aria-pressed',AW);b.innerHTML='<i></i>'+(AW?'Away':'Active')+' · sent';
   setTimeout(()=>{b.innerHTML='<i></i>'+(AW?'Away':'Active')},4000);return;
  }
 }catch(err){}
 let ok=true;try{await navigator.clipboard.writeText('AWAY '+want)}catch(_){ok=false}
 b.textContent=ok?'Copied "AWAY '+want+'"':'Copy blocked';setTimeout(()=>{b.innerHTML=old},2400);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.act input')){e.preventDefault();e.target.closest('.act').querySelector('[data-copy=tell]').click()}});
render();
</script>
